<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Equipos de Impulsión</title>
<meta name="theme-color" content="#913E2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Impulsión">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --primary:#174A73;--secondary:#2F6EA5;--background:#F4F7FB;
  --line:#DCE3EC;--text:#1F2937;--muted:#667085;--danger:#B42318;
}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:contain}
.admin-fab,#loginModal,#adminModal{display:none!important}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--background);color:var(--text)}
.app{max-width:960px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #0002;margin-bottom:18px}
.hero-image{display:none;width:100%;max-height:260px;object-fit:contain;background:#fff;padding:10px}
.hero-body{padding:22px}
.hero-main-row{display:flex;align-items:center;justify-content:space-between;gap:22px}
.hero-copy{min-width:0;flex:1}
.logo-left-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo{display:none;object-fit:contain;background:#fff;border-radius:8px;padding:5px}
.logo-left{max-height:48px;max-width:145px}
.logo-right{
  max-height:82px;
  max-width:205px;
  flex:0 0 auto;
  background:#fff;
  padding:7px 10px;
  border-radius:10px;
}
.header-texts{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:700;opacity:.92}
.hero h1{margin:10px 0 6px;font-size:29px}.subtitle{opacity:.94}
@media(max-width:700px){
  .hero-main-row{gap:10px}
  .logo-right{max-width:120px;max-height:58px;padding:5px 7px}
  .logo-left{max-width:95px;max-height:40px}
}
.badge{display:inline-block;background:#ffffff26;padding:6px 10px;border-radius:999px;font-size:12px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0000000a}
[data-key].missing-decision{border:2px solid #D92D20;box-shadow:0 0 0 3px rgba(217,45,32,.10)}
.area-card{background:#EEF4FA;border-left:5px solid var(--secondary)}
.section-title{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:8px}
.equipment-title{font-size:17px;font-weight:700;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #CBD5E1;border-radius:9px;font-size:14px;background:#fff;color:#111827}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--secondary);box-shadow:0 0 0 3px rgba(47,110,165,.12)}
.required:after{content:" *";color:#D92D20}
.yesno{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #CBD5E1;background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700}
.yes.active{background:#E8F5EF;border-color:#81C8AA;color:#157347}.no.active{background:#F3F4F6;border-color:#B8BEC8;color:#4B5563}
.fields{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #CBD5E1}.fields.show{display:block}
.help{font-size:12px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.main-button,.secondary-button,.danger-button{border:0;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer}
.main-button{background:var(--primary);color:#fff}.secondary-button{background:#E7EDF4;color:#23415F}.danger-button{background:#FEE4E2;color:#912018}
.fill{flex:1;min-width:190px}.panel{display:none}.panel.show{display:block}
.success{background:#EAF7EF;border:1px solid #9FD6B8;color:#155B37}.error{background:#FFF0F0;border:1px solid #EFB1B1;color:#8F1B1B}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #D9DEE7;padding:8px;text-align:left;vertical-align:top}th{background:#EEF4FB;color:#254A6B}
.footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}


.equipment-group{
  margin-top:8px;
  padding:9px 10px;
  border:1px solid #DCE3EC;
  border-radius:10px;
  background:#F8FAFC;
}
.equipment-group-title{
  color:var(--primary);
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  margin-bottom:7px;
}
.equipment-group .grid{gap:8px}
.equipment-group label{font-size:12px;margin-bottom:4px}
.equipment-group input,
.equipment-group select{padding:8px 9px}
.equipment-group textarea{min-height:62px}
.equipment-group.control-group{background:#fff}
.equipment-status-inline{
  margin-top:8px;
}
.equipment-status-inline .field-wrap{
  margin-bottom:4px;
}
.equipment-plain-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:8px;
}
.equipment-observation-inline{
  margin-top:10px;
  width:100%;
}
.equipment-observation-inline .field-wrap{
  width:100%;
}
.equipment-observation-inline textarea{
  min-height:82px;
  width:100%;
}
@media(max-width:700px){
  .equipment-plain-grid{
    grid-template-columns:1fr;
  }
}
.equipment-group.observation-group{
  background:#fff;
}
.equipment-grid-single{grid-template-columns:minmax(0,1fr)}
.equipment-grid-vdf{grid-template-columns:repeat(3,minmax(0,1fr))}
.equipment-grid-generator{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ADMIN */
.admin-fab{position:fixed;right:18px;bottom:18px;z-index:30;border:0;border-radius:999px;background:#111827;color:#fff;padding:12px 16px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px #0004}
.modal{position:fixed;inset:0;background:#0008;display:none;z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.modal-card{background:#fff;width:min(1100px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0005}
.admin-login{max-width:420px}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab-btn{border:1px solid #CBD5E1;background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer;font-weight:700}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.admin-tab{display:none}.admin-tab.show{display:block}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.admin-list{display:grid;gap:10px}.admin-row{border:1px solid #D9DEE7;border-radius:12px;padding:12px;background:#FAFBFC}
.row-grid-4{display:grid;grid-template-columns:120px 90px 1fr 110px;gap:8px;align-items:end}
.row-grid-5{display:grid;grid-template-columns:120px 80px 1fr 1fr 100px;gap:8px;align-items:end}
.row-grid-field{display:grid;grid-template-columns:120px 120px 70px 1.4fr 110px 100px 100px 130px 1fr;gap:8px;align-items:end}
.mini{font-size:11px;color:var(--muted)}
.admin-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.status-msg{font-size:13px;margin-top:8px}
.image-tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.color-board{
  margin-top:16px;
  border:1px solid #D9DEE7;
  border-radius:14px;
  padding:14px;
  background:#FAFBFC;
}
.color-board-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:10px;
}
.color-control{
  border:1px solid #E2E8F0;
  border-radius:12px;
  padding:10px;
  background:#fff;
}
.color-control-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:7px;
}
.color-picker{
  width:54px;
  height:42px;
  padding:2px;
  border:1px solid #CBD5E1;
  border-radius:9px;
  background:#fff;
  cursor:pointer;
}
.color-hex{
  flex:1;
  min-width:0;
  font-family:monospace;
}
.palette-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.palette-button{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid #CBD5E1;
  background:#fff;
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
  font-weight:700;
}
.palette-button:hover{
  border-color:var(--secondary);
  box-shadow:0 0 0 2px rgba(47,110,165,.08);
}
.palette-dots{
  display:flex;
  gap:3px;
}
.palette-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:1px solid #0002;
}
.admin-footer{
  position:sticky;
  bottom:-18px;
  margin:18px -18px -18px;
  padding:12px 18px;
  background:#fff;
  border-top:1px solid #D9DEE7;
  display:flex;
  justify-content:flex-start;
  z-index:5;
}
.admin-close-bottom{
  min-width:170px;
}


.equipment-header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
}
.equipment-header-row .equipment-title{
  margin:0;
  min-width:0;
}
.equipment-media{
  flex:0 0 auto;
  text-align:right;
}
.equipment-media input[type="file"]{
  display:none;
}
.photo-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
  padding:7px 11px;
  border:1px solid #CBD5E1;
  border-radius:9px;
  background:#F8FAFC;
  color:#23415F;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
  min-width:126px;
}
.photo-button:hover{background:#EEF4FA}
.photo-button.has-photo{
  background:#E8F5EF;
  border-color:#81C8AA;
  color:#157347;
}
.photo-optional{
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
  font-weight:700;
}
.photo-optional.hidden{
  display:none;
}
.photo-remove{
  display:none;
  margin-top:5px;
  margin-left:auto;
  border:1px solid #F0B4AE;
  background:#FFF5F4;
  color:#B42318;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.photo-remove.show{
  display:block;
}
@media(max-width:560px){
  .equipment-header-row{
    align-items:center;
  }
  .photo-button{
    min-height:34px;
    padding:6px 8px;
    font-size:11px;
    min-width:116px;
  }
}

.signature-wrap{
  margin-top:16px;
  border-top:1px solid #E4E7EC;
  padding-top:16px;
}
.signature-pad-shell{
  position:relative;
}
.signature-pad{
  width:100%;
  height:180px;
  display:block;
  border:2px dashed #98A2B3;
  border-radius:12px;
  background:#fff;
  touch-action:pan-y;
  cursor:default;
}
.signature-pad.enabled{
  touch-action:none;
  cursor:crosshair;
  border-style:solid;
  border-color:#2F6EA5;
  box-shadow:0 0 0 3px rgba(47,110,165,.10);
}
.signature-lock-overlay{
  position:absolute;
  inset:2px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:14px;
  border-radius:10px;
  background:rgba(248,250,252,.80);
  color:#667085;
  font-size:13px;
  font-weight:700;
  pointer-events:none;
}
.signature-lock-overlay.hidden{
  display:none;
}
.signature-actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:8px;
}
.signature-enable-button{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:#174A73;
  color:#fff;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}
.signature-enable-button.active{
  background:#157347;
}
.signature-status{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}
.signature-status.active{
  color:#174A73;
}
.signature-status.signed{
  color:#157347;
}

.offline-status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:11px 14px;
  margin:10px 0 14px;
  border:1px solid #B8C6D6;
  border-radius:12px;
  background:#F6F9FC;
  font-size:13px;
}
.offline-status.online{
  border-color:#A9D5B7;
  background:#F1FAF4;
}
.offline-status.offline{
  border-color:#E8B7B2;
  background:#FFF4F2;
}
.offline-status.pending{
  border-color:#E9CF8B;
  background:#FFF9E8;
}
.offline-main{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
}
.offline-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#667085;
  display:inline-block;
}
.offline-status.online .offline-dot{background:#198754}
.offline-status.offline .offline-dot{background:#D92D20}
.offline-status.pending .offline-dot{background:#C48200}
.offline-secondary{
  color:#667085;
  font-size:12px;
}
.offline-sync-button{
  border:1px solid var(--primary);
  color:var(--primary);
  background:#fff;
  border-radius:9px;
  padding:7px 10px;
  font-weight:700;
  cursor:pointer;
}
.offline-sync-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}


@media(max-width:850px){
  .row-grid-4,.row-grid-5,.row-grid-field,.admin-grid,.image-tools{grid-template-columns:1fr}
}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:23px}
  .app{padding:9px}
  .logo{max-width:120px;max-height:48px}
  .admin-fab{right:10px;bottom:10px}
  .color-board-grid{grid-template-columns:1fr}
  .admin-footer{bottom:-18px}

  /* Los campos de equipos se mantienen compactos en celular */
  .equipment-group .equipment-grid-vdf{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .equipment-group .equipment-grid-generator{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .equipment-group .equipment-grid-single{
    grid-template-columns:1fr;
  }
}
@media(max-width:390px){
  .equipment-group .equipment-grid-vdf{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;
  }
  .equipment-group .equipment-grid-vdf input{
    padding:8px 5px;
  }
}
</style>
</head>
<body>
<div class="app">
  <div id="loading" class="card">Cargando aplicación…</div>

  <main id="appMain" style="display:none">
    <section class="hero">
      <img id="headerImage" class="hero-image" alt="Encabezado">
      <div class="hero-body">
        <div class="hero-main-row">
          <div class="hero-copy">
            <div class="logo-left-row">
              <img id="logoLeft" class="logo logo-left" alt="Logo izquierdo">
            </div>
            <div class="header-texts"><span id="headerLeftText"></span><span id="headerRightText"></span></div>
            <h1 id="appTitle"></h1>
            <div id="subtitle" class="subtitle"></div>
            <div id="badge" class="badge"></div>
          </div>
          <img id="logoRight" class="logo logo-right" alt="Logo derecho">
        </div>
      </div>
    </section>

    <section id="publicClosedPanel" class="card panel" style="text-align:center"></section>

    <section id="offlineStatusBar" class="offline-status">
      <div>
        <div class="offline-main">
          <span class="offline-dot"></span>
          <span id="offlineConnectionText">Preparando aplicación offline…</span>
        </div>
        <div id="offlineSaveText" class="offline-secondary">Inicializando almacenamiento de la tablet.</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="offlinePendingText" class="offline-secondary">Pendientes: 0</span>
        <button id="offlineSyncButton" type="button" class="offline-sync-button" onclick="syncPendingControls()">Sincronizar</button>
      </div>
    </section>

    <div id="generalContainer"></div>
    <div id="sectionsContainer"></div>
    <div id="closureContainer"></div>

    <div id="errorBox" class="card error panel"></div>

    <div id="formActions" class="actions">
      <button id="previewButton" type="button" class="secondary-button" onclick="showPreview()"></button>
      <button id="sendButton" type="button" class="main-button fill" onclick="submitControl()"></button>
    </div>

    <section id="previewPanel" class="card panel">
      <div class="section-title">Vista previa</div>
      <div style="overflow:auto">
        <table><thead><tr><th>Sección</th><th>Equipo</th><th>Datos</th></tr></thead><tbody id="previewBody"></tbody></table>
      </div>
    </section>

    <section id="successPanel" class="card success panel">
      <strong id="successTitle"></strong>
      <div id="successMessage" style="margin-top:6px"></div>
      <button id="newControlButton" class="secondary-button" type="button" style="margin-top:12px" onclick="startNewControl()"></button>
    </section>

    <div id="footerText" class="footer"></div>
  </main>
</div>

<button class="admin-fab" style="display:none!important" aria-hidden="true">Administrar</button>

<!-- LOGIN -->
<div id="loginModal" class="modal">
  <div class="modal-card admin-login">
    <div class="admin-head">
      <div>
        <div class="section-title">Modo administrador</div>
        <div class="help">PIN inicial de prueba: 2468. Cámbialo después.</div>
      </div>
      <button class="secondary-button" onclick="closeLogin()">✕</button>
    </div>
    <div style="margin-top:14px">
      <label>PIN</label>
      <input id="adminPinInput" type="password" placeholder="Ingrese PIN">
    </div>
    <button class="main-button fill" style="margin-top:14px" onclick="loginAdmin()">ENTRAR</button>
    <div id="loginError" class="status-msg" style="color:#B42318"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminModal" class="modal">
  <div class="modal-card">
    <div class="admin-head">
      <div>
        <div class="section-title">Editar aplicación</div>
        <div class="help">Los cambios se guardan en la base y aparecen al recargar.</div>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="design" onclick="showAdminTab('design',this)">Diseño</button>
      <button class="tab-btn" data-tab="sections" onclick="showAdminTab('sections',this)">Secciones</button>
      <button class="tab-btn" data-tab="equipment" onclick="showAdminTab('equipment',this)">Equipos</button>
      <button class="tab-btn" data-tab="fields" onclick="showAdminTab('fields',this)">Preguntas</button>
      <button class="tab-btn" data-tab="options" onclick="showAdminTab('options',this)">Opciones</button>
      <button class="tab-btn" data-tab="notifications" onclick="showAdminTab('notifications',this)">Notificaciones</button>
      <button class="tab-btn" data-tab="security" onclick="showAdminTab('security',this)">Seguridad</button>
    </div>

    <section id="tab_design" class="admin-tab show"></section>
    <section id="tab_sections" class="admin-tab"></section>
    <section id="tab_equipment" class="admin-tab"></section>
    <section id="tab_fields" class="admin-tab"></section>
    <section id="tab_options" class="admin-tab"></section>
    <section id="tab_notifications" class="admin-tab"></section>
    <section id="tab_security" class="admin-tab"></section>

    <div id="adminStatus" class="status-msg"></div>

    <div class="admin-footer">
      <button class="secondary-button admin-close-bottom" onclick="closeAdmin()">← Cerrar administrador</button>
    </div>
  </div>

const PWA_BOOTSTRAP_KEY='pwaBootstrap';
const PWA_BACKEND_STORAGE_KEY='MCM_IMP_BACKEND_URL';

window.addEventListener('load',async()=>{
  registerMcmServiceWorker();

  try{
    await initOfflineStorage();
    await loadPwaBootstrap();
  }catch(err){
    console.error('Inicio PWA:',err);
    showFatal(err);
  }
});

function registerMcmServiceWorker(){
  if(!('serviceWorker' in navigator)) return;

  navigator.serviceWorker.register('./sw.js')
    .then(()=>console.log('MCM Equipos de Impulsión: Service Worker activo.'))
    .catch(err=>console.error('Service Worker:',err));
}

function normalizeBackendUrl(url){
  const value=String(url||'').trim();
  if(!value) return '';

  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/i.test(value)){
    throw Error(
      'El enlace del servidor debe ser el enlace /exec de la implementación piloto de Google Apps Script.'
    );
  }

  return value.split('?')[0];
}

function getBackendUrl(allowPrompt=true){
  const params=new URLSearchParams(location.search);

  if(params.get('config')==='1'){
    localStorage.removeItem(PWA_BACKEND_STORAGE_KEY);
    history.replaceState({},document.title,location.pathname);
  }

  let url=localStorage.getItem(PWA_BACKEND_STORAGE_KEY)||'';

  if(!url&&allowPrompt&&navigator.onLine){
    const entered=window.prompt(
      'CONFIGURACIÓN INICIAL MCM\\n\\n'+
      'Pega el enlace /exec de la implementación Impulsión Offline Piloto.\\n\\n'+
      'Esto se configura una sola vez en esta tablet.'
    );

    if(entered){
      url=normalizeBackendUrl(entered);
      localStorage.setItem(PWA_BACKEND_STORAGE_KEY,url);
    }
  }

  return url;
}

function jsonpRequest(params,timeoutMs=18000){
  return new Promise((resolve,reject)=>{
    let backend='';

    try{
      backend=getBackendUrl(true);
    }catch(e){
      reject(e);
      return;
    }

    if(!backend){
      reject(Error('Servidor MCM no configurado en esta tablet.'));
      return;
    }

    const callback='__mcm_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const query=new URLSearchParams(params||{});

    query.set('callback',callback);
    query.set('_t',Date.now());

    let finished=false;

    const cleanup=()=>{
      if(finished) return;
      finished=true;

      try{delete window[callback]}catch(e){}
      if(script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    };

    window[callback]=(data)=>{
      cleanup();
      resolve(data);
    };

    script.onerror=()=>{
      cleanup();
      reject(Error('No se pudo comunicar con el servidor MCM.'));
    };

    script.src=backend+'?'+query.toString();
    document.head.appendChild(script);

    const timer=setTimeout(()=>{
      cleanup();
      reject(Error('El servidor MCM no respondió dentro del tiempo esperado.'));
    },timeoutMs);
  });
}

async function loadPwaBootstrap(){
  let cached=null;

  try{
    const row=await offlineKvGet(PWA_BOOTSTRAP_KEY);
    cached=row&&row.value?row.value:null;
  }catch(e){}

  if(navigator.onLine){
    try{
      const response=await jsonpRequest({api:'bootstrap'},20000);

      if(!response||response.ok!==true||!response.data){
        throw Error(response&&response.message?response.message:'Respuesta de configuración inválida.');
      }

      await offlineKvPut(PWA_BOOTSTRAP_KEY,response.data);
      initApp(response.data);
      return;
    }catch(err){
      console.warn('Bootstrap remoto:',err);
    }
  }

  if(cached){
    initApp(cached);
    return;
  }

  throw Error(
    'Esta tablet todavía no tiene la aplicación preparada para uso offline. '+
    'Conéctala a internet una vez, abre Equipos de Impulsión y espera a que cargue completamente.'
  );
}

function $(id){return document.getElementById(id)}

function initApp(data){
  state.config=data.config||{};
  state.sections=data.sections||[];
  state.equipment=data.equipment||[];
  state.fields=data.fields||[];
  state.options=data.options||{};
  applyConfig();
  renderApp();
  $('loading').style.display='none';
  $('appMain').style.display='block';

  requestAnimationFrame(()=>{
    offlineAfterRender();
  });
}

async function reloadPublic(){
  if(!navigator.onLine){
    updateOfflineStatus('Sin conexión: se mantiene la configuración guardada en esta tablet.');
    return;
  }

  try{
    const response=await jsonpRequest({api:'bootstrap'},20000);

    if(!response||response.ok!==true||!response.data){
      throw Error('No se pudo actualizar la configuración.');
    }

    await offlineKvPut(PWA_BOOTSTRAP_KEY,response.data);

    state.config=response.data.config||{};
    state.sections=response.data.sections||[];
    state.equipment=response.data.equipment||[];
    state.fields=response.data.fields||[];
    state.options=response.data.options||{};

    applyConfig();
    renderApp();
    updateOfflineStatus('Configuración actualizada desde el servidor MCM.');
  }catch(e){
    updateOfflineStatus('No se pudo actualizar la configuración: '+(e.message||e));
  }
}

function applyConfig(){
  const c=state.config;
  if(c.PRIMARY_COLOR)document.documentElement.style.setProperty('--primary',c.PRIMARY_COLOR);
  if(c.SECONDARY_COLOR)document.documentElement.style.setProperty('--secondary',c.SECONDARY_COLOR);
  if(c.BACKGROUND_COLOR)document.documentElement.style.setProperty('--background',c.BACKGROUND_COLOR);

  $('appTitle').textContent=c.APP_TITLE||'CONTROL DE FLUJOS DEWATERING';
  $('subtitle').textContent=c.SUBTITLE||'';
  $('badge').textContent=c.BADGE_TEXT||'';
  $('headerLeftText').textContent=c.HEADER_LEFT_TEXT||'';
  $('headerRightText').textContent=c.HEADER_RIGHT_TEXT||'';
  $('previewButton').textContent=c.PREVIEW_BUTTON_TEXT||'Vista previa';
  $('sendButton').textContent=c.SEND_BUTTON_TEXT||'ENVIAR CONTROL';
  $('newControlButton').textContent=c.NEW_CONTROL_BUTTON_TEXT||'NUEVO CONTROL';
  $('footerText').textContent=c.FOOTER_TEXT||'';

  setImage('headerImage',c.HEADER_IMAGE_URL || DEFAULT_HEADER_IMAGE, DEFAULT_HEADER_IMAGE);
  setImage('logoLeft',c.LOGO_LEFT_URL);
  setImage('logoRight',c.LOGO_RIGHT_URL);

/* ================= V1.9.0 OFFLINE PWA ================= */

const OFFLINE_DB_NAME='MCM_Impulsion_Offline_V1';
const OFFLINE_DB_VERSION=1;
const OFFLINE_STORE_KV='kv';
const OFFLINE_STORE_QUEUE='queue';
const OFFLINE_DRAFT_KEY='currentDraft';

function initOfflineStorage(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(Error('Este navegador no soporta almacenamiento offline.'));
      return;
    }

    const request=indexedDB.open(OFFLINE_DB_NAME,OFFLINE_DB_VERSION);

    request.onupgradeneeded=()=>{
      const db=request.result;

      if(!db.objectStoreNames.contains(OFFLINE_STORE_KV)){
        db.createObjectStore(OFFLINE_STORE_KV,{keyPath:'key'});
      }

      if(!db.objectStoreNames.contains(OFFLINE_STORE_QUEUE)){
        db.createObjectStore(OFFLINE_STORE_QUEUE,{keyPath:'id'});
      }
    };

    request.onsuccess=async()=>{
      state.offline.db=request.result;
      state.offline.ready=true;

      try{
        if(navigator.storage&&navigator.storage.persist){
          await navigator.storage.persist();
        }
      }catch(e){}

      installOfflineListeners();
      resolve();
    };

    request.onerror=()=>reject(request.error||Error('No se pudo abrir IndexedDB.'));
  });
}

function offlineTx(storeName,mode,operation){
  return new Promise((resolve,reject)=>{
    if(!state.offline.db){
      reject(Error('Almacenamiento local no disponible.'));
      return;
    }

    const tx=state.offline.db.transaction(storeName,mode);
    const store=tx.objectStore(storeName);
    let req;

    try{
      req=operation(store);
    }catch(e){
      reject(e);
      return;
    }

    if(req){
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||Error('Error de almacenamiento local.'));
    }else{
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||Error('Error de almacenamiento local.'));
    }
  });
}

function offlineKvGet(key){
  return offlineTx(OFFLINE_STORE_KV,'readonly',store=>store.get(key));
}

function offlineKvPut(key,value){
  return offlineTx(
    OFFLINE_STORE_KV,
    'readwrite',
    store=>store.put({key:key,value:value,updatedAt:new Date().toISOString()})
  );
}

function offlineKvDelete(key){
  return offlineTx(OFFLINE_STORE_KV,'readwrite',store=>store.delete(key));
}

function offlineQueuePut(entry){
  return offlineTx(OFFLINE_STORE_QUEUE,'readwrite',store=>store.put(entry));
}

function offlineQueueDelete(id){
  return offlineTx(OFFLINE_STORE_QUEUE,'readwrite',store=>store.delete(id));
}

function offlineQueueAll(){
  return offlineTx(OFFLINE_STORE_QUEUE,'readonly',store=>store.getAll());
}

function newClientControlId(){
  if(window.crypto&&crypto.randomUUID){
    return 'MCM-IMP-'+crypto.randomUUID();
  }

  return 'MCM-IMP-'+
    Date.now().toString(36).toUpperCase()+'-'+
    Math.random().toString(36).slice(2,10).toUpperCase();
}

function ensureCurrentControlIdentity(){
  if(!state.offline.clientControlId){
    state.offline.clientControlId=newClientControlId();
  }

  if(!state.offline.controlCreatedAt){
    state.offline.controlCreatedAt=new Date().toISOString();
  }
}

function installOfflineListeners(){
  window.addEventListener('online',()=>{
    updateOfflineStatus();
    syncPendingControls();
  });

  window.addEventListener('offline',()=>{
    updateOfflineStatus();
    scheduleDraftSave(50);
  });

  document.addEventListener('input',e=>{
    if(e.target&&e.target.closest&&e.target.closest('#adminModal')) return;
    scheduleDraftSave();
  },true);

  document.addEventListener('change',e=>{
    if(e.target&&e.target.closest&&e.target.closest('#adminModal')) return;
    scheduleDraftSave();
  },true);

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){
      saveCurrentDraftNow();
    }
  });

  window.addEventListener('pagehide',()=>{
    saveCurrentDraftNow();
  });
}

async function offlineAfterRender(){
  ensureCurrentControlIdentity();
  updateOfflineStatus();

  const restored=await offerRestoreDraft();

  if(!restored){
    scheduleDraftSave(250);
  }

  updateOfflinePendingCount();

  if(navigator.onLine){
    syncPendingControls();
  }
}

function updateOfflineStatus(extraMessage){
  const bar=$('offlineStatusBar');
  const conn=$('offlineConnectionText');
  const save=$('offlineSaveText');
  const syncBtn=$('offlineSyncButton');

  if(!bar||!conn||!save) return;

  bar.classList.remove('online','offline','pending');

  if(!navigator.onLine){
    bar.classList.add('offline');
    conn.textContent='SIN CONEXIÓN · puede continuar registrando';
  }else if(state.offline.syncing){
    bar.classList.add('pending');
    conn.textContent='Sincronizando controles pendientes…';
  }else{
    bar.classList.add('online');
    conn.textContent='Con conexión';
  }

  if(extraMessage){
    save.textContent=extraMessage;
  }else if(state.offline.lastSavedAt){
    save.textContent='Guardado en esta tablet: '+formatOfflineClock(state.offline.lastSavedAt);
  }else{
    save.textContent='El control se guarda automáticamente en esta tablet.';
  }

  if(syncBtn){
    syncBtn.disabled=!navigator.onLine||state.offline.syncing;
  }
}

function formatOfflineClock(value){
  const d=value instanceof Date?value:new Date(value);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function scheduleDraftSave(delay){
  if(!state.offline.ready||state.offline.restoring) return;

  clearTimeout(state.offline.saveTimer);
  state.offline.saveTimer=setTimeout(()=>{
    saveCurrentDraftNow();
  },typeof delay==='number'?delay:650);
}

function captureDraftSnapshot(){
  ensureCurrentControlIdentity();

  const general={};
  const closure={};
  const equipment={};

  fieldsFor('GENERAL').forEach(f=>{
    const el=document.querySelector('[data-bind="general.'+f.id+'"]');
    general[f.id]=el?el.value:'';
  });

  fieldsFor('CLOSURE').forEach(f=>{
    const el=document.querySelector('[data-bind="closure.'+f.id+'"]');
    closure[f.id]=el?el.value:'';
  });

  document.querySelectorAll('[data-key]').forEach(card=>{
    const key=card.dataset.key;
    const values={};

    card.querySelectorAll('[data-field-id]').forEach(el=>{
      values[el.dataset.fieldId]=el.value;
    });

    const reason=card.querySelector('[data-no-reason]');

    equipment[key]={
      decision:state.selected[key]||'',
      values:values,
      reasonNo:reason?reason.value:'',
      image:state.equipmentImages[key]||null
    };
  });

  let signatureData='';

  if(state.signatureHasInk&&state.signatureCanvas){
    try{
      signatureData=state.signatureCanvas.toDataURL('image/png');
    }catch(e){}
  }

  return{
    version:1,
    clientControlId:state.offline.clientControlId,
    controlCreatedAt:state.offline.controlCreatedAt,
    savedAt:new Date().toISOString(),
    general:general,
    closure:closure,
    equipment:equipment,
    signatureData:signatureData
  };
}

async function saveCurrentDraftNow(){
  if(!state.offline.ready||state.offline.restoring) return;

  try{
    const draft=captureDraftSnapshot();
    await offlineKvPut(OFFLINE_DRAFT_KEY,draft);
    state.offline.lastSavedAt=new Date(draft.savedAt);
    updateOfflineStatus();
  }catch(e){
    console.error('No se pudo guardar borrador:',e);
    updateOfflineStatus('No se pudo confirmar el guardado local.');
  }
}

function draftHasUsefulData(draft){
  if(!draft) return false;

  const hasGeneral=Object.values(draft.general||{}).some(v=>String(v||'').trim());
  const hasClosure=Object.values(draft.closure||{}).some(v=>String(v||'').trim());

  const hasEquipment=Object.values(draft.equipment||{}).some(item=>{
    return item&&(
      item.decision||
      String(item.reasonNo||'').trim()||
      Object.values(item.values||{}).some(v=>String(v||'').trim())||
      (item.image&&item.image.dataUrl)
    );
  });

  return hasGeneral||hasClosure||hasEquipment||Boolean(draft.signatureData);
}

async function offerRestoreDraft(){
  if(!state.offline.ready) return false;

  try{
    const row=await offlineKvGet(OFFLINE_DRAFT_KEY);
    const draft=row&&row.value?row.value:null;

    if(!draft||!draftHasUsefulData(draft)) return false;

    const savedText=draft.savedAt
      ? new Date(draft.savedAt).toLocaleString()
      : 'sin hora disponible';

    const continueDraft=window.confirm(
      'Hay un control de Equipos de Impulsión en curso guardado en esta tablet.\\n\\n'+
      'Último guardado: '+savedText+'\\n\\n'+
      'Aceptar = continuar el control.\\n'+
      'Cancelar = comenzar uno nuevo.'
    );

    if(continueDraft){
      await restoreDraftSnapshot(draft);
      return true;
    }

    await offlineKvDelete(OFFLINE_DRAFT_KEY);
    state.offline.clientControlId=newClientControlId();
    state.offline.controlCreatedAt=new Date().toISOString();
    return false;
  }catch(e){
    console.error('No se pudo recuperar borrador:',e);
    return false;
  }
}

async function restoreDraftSnapshot(draft){
  state.offline.restoring=true;

  try{
    state.offline.clientControlId=draft.clientControlId||newClientControlId();
    state.offline.controlCreatedAt=draft.controlCreatedAt||new Date().toISOString();

    fieldsFor('GENERAL').forEach(f=>{
      const el=document.querySelector('[data-bind="general.'+f.id+'"]');
      if(el&&draft.general&&Object.prototype.hasOwnProperty.call(draft.general,f.id)){
        el.value=draft.general[f.id]||'';
      }
    });

    fieldsFor('CLOSURE').forEach(f=>{
      const el=document.querySelector('[data-bind="closure.'+f.id+'"]');
      if(el&&draft.closure&&Object.prototype.hasOwnProperty.call(draft.closure,f.id)){
        el.value=draft.closure[f.id]||'';
      }
    });

    document.querySelectorAll('[data-key]').forEach(card=>{
      const key=card.dataset.key;
      const saved=draft.equipment&&draft.equipment[key]?draft.equipment[key]:null;

      if(!saved) return;

      const decision=saved.decision||'';
      state.selected[key]=decision||null;

      card.querySelectorAll('.pill').forEach(btn=>btn.classList.remove('active'));

      if(decision==='YES'){
        const btn=card.querySelector('.pill.yes');
        if(btn) btn.classList.add('active');
      }else if(decision==='NO'){
        const btn=card.querySelector('.pill.no');
        if(btn) btn.classList.add('active');
      }

      const detail=$('fields_'+key);
      const reasonBox=$('no_reason_'+key);

      if(detail) detail.classList.toggle('show',decision==='YES');
      if(reasonBox) reasonBox.classList.toggle('show',decision==='NO');

      card.querySelectorAll('[data-field-id]').forEach(el=>{
        const id=el.dataset.fieldId;
        if(saved.values&&Object.prototype.hasOwnProperty.call(saved.values,id)){
          el.value=saved.values[id]||'';
        }
      });

      const reason=card.querySelector('[data-no-reason]');
      if(reason) reason.value=saved.reasonNo||'';

      if(saved.image&&saved.image.dataUrl){
        state.equipmentImages[key]=saved.image;

        const button=card.querySelector('[data-photo-button]');
        const text=card.querySelector('[data-photo-button-text]');
        const remove=card.querySelector('[data-remove-equipment-photo]');
        const optional=card.querySelector('[data-photo-optional]');

        if(text) text.textContent='✓ Imagen recuperada';
        if(button) button.classList.add('has-photo');
        if(optional) optional.classList.add('hidden');
        if(remove) remove.classList.add('show');
      }
    });

    if(draft.signatureData){
      await restoreSignatureData(draft.signatureData);
    }

    state.offline.lastSavedAt=draft.savedAt?new Date(draft.savedAt):new Date();
    updateOfflineStatus('Control en curso recuperado correctamente.');
  }finally{
    state.offline.restoring=false;
  }
}

function restoreSignatureData(dataUrl){
  return new Promise(resolve=>{
    const waitForCanvas=(attempt)=>{
      const canvas=state.signatureCanvas||$('signatureCanvas');
      const ctx=state.signatureCtx;

      if((!canvas||!ctx)&&attempt<20){
        setTimeout(()=>waitForCanvas(attempt+1),100);
        return;
      }

      if(!canvas||!ctx){
        resolve();
        return;
      }

      const img=new Image();

      img.onload=()=>{
        const rect=canvas.getBoundingClientRect();
        ctx.clearRect(0,0,rect.width,180);
        ctx.fillStyle='#FFFFFF';
        ctx.fillRect(0,0,rect.width,180);
        ctx.drawImage(img,0,0,rect.width,180);
        ctx.strokeStyle='#111827';

        state.signatureHasInk=true;
        state.signatureEnabled=false;
        updateSignatureUi();
        resolve();
      };

      img.onerror=()=>resolve();
      img.src=dataUrl;
    };

    waitForCanvas(0);
  });
}

async function clearCurrentDraftAndIdentity(){
  try{
    if(state.offline.ready){
      await offlineKvDelete(OFFLINE_DRAFT_KEY);
    }
  }catch(e){}

  state.offline.clientControlId=newClientControlId();

async function queueCurrentControl(payload,reason){
  ensureCurrentControlIdentity();

  payload.clientControlId=state.offline.clientControlId;
  payload.controlCreatedAt=state.offline.controlCreatedAt;

  const entry={
    id:payload.clientControlId,

    lastError:String(reason||''),

  };

async function updateOfflinePendingCount(){
  const label=$('offlinePendingText');

  try{
    const items=state.offline.ready?await offlineQueueAll():[];
    if(label) label.textContent='Pendientes: '+items.length;
    return items.length;
  }catch(e){
    if(label) label.textContent='Pendientes: ?';
    return 0;
  }
}

function delayMs(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function postRoundToBackend(payload){
  return new Promise((resolve,reject)=>{
    let backend='';

    try{
      backend=getBackendUrl(true);
    }catch(e){
      reject(e);
      return;
    }

    if(!backend){
      reject(Error('Servidor MCM no configurado.'));
      return;
    }

    const frameName='mcmSyncFrame_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const iframe=document.createElement('iframe');
    iframe.name=frameName;
    iframe.style.display='none';
    iframe.setAttribute('aria-hidden','true');

    const form=document.createElement('form');
    form.method='POST';
    form.action=backend;
    form.target=frameName;
    form.style.display='none';

    const api=document.createElement('input');
    api.type='hidden';
    api.name='api';
    api.value='saveRoundOffline';

    const data=document.createElement('textarea');
    data.name='payload';
    data.value=JSON.stringify(payload);

    form.appendChild(api);
    form.appendChild(data);

    document.body.appendChild(iframe);
    document.body.appendChild(form);

    try{
      form.submit();
    }catch(e){
      form.remove();
      iframe.remove();
      reject(e);
      return;
    }

    // Un POST tradicional cross-origin no permite leer la respuesta.
    // La confirmación se consulta después mediante JSONP.
    setTimeout(()=>{
      try{form.remove()}catch(e){}
    },1200);

    setTimeout(()=>{
      try{iframe.remove()}catch(e){}
    },60000);

    resolve();
  });
}

async function queryRoundSyncStatus(clientControlId){
  return jsonpRequest(
    {
      api:'syncStatus',
      clientControlId:String(clientControlId||'')
    },
    12000
  );
}

async function saveRoundPromise(payload){
  if(!navigator.onLine){
    throw Error('Sin conexión.');
  }

  if(!payload||!payload.clientControlId){
    throw Error('El control no tiene identificador offline.');
  }

  await postRoundToBackend(payload);

  let lastStatus=null;

  // Apps Script puede tardar varios segundos en crear PDF y enviar correo.
  // Esperamos confirmación final antes de retirar el control de pendientes.
  for(let attempt=0;attempt<18;attempt++){
    await delayMs(attempt===0?1200:2200);

    if(!navigator.onLine){
      throw Error('Se perdió la conexión durante la sincronización.');
    }

    try{
      const status=await queryRoundSyncStatus(payload.clientControlId);
      lastStatus=status;

      if(status&&status.complete){
        if(status.ok===false){
          throw Error(status.message||'El servidor rechazó el control.');
        }

        return {
          ok:true,
          duplicate:Boolean(status.duplicate),
          roundId:status.roundId||'',
          controlNumber:status.controlNumber||'',
          count:Number(status.count||payload.equipment.length||0),
          officialSaved:Boolean(status.officialSaved),
          officialMessage:status.officialMessage||'',
          pdfSaved:Boolean(status.pdfSaved),
          pdfMessage:status.pdfMessage||'',
          pdfUrl:status.pdfUrl||'',
          emailSent:Boolean(status.emailSent),
          emailMessage:status.emailMessage||''
        };
      }
    }catch(err){
      // Si el estado aún no está listo, seguimos intentando.
      if(attempt>=17) throw err;
    }
  }

  throw Error(
    lastStatus&&lastStatus.found
      ? 'El servidor recibió el control, pero todavía no confirmó el proceso completo. Se mantendrá pendiente para verificarlo nuevamente.'
      : 'No fue posible confirmar la recepción del control. Se mantendrá pendiente.'
  );
}

async function syncPendingControls(){
  if(!state.offline.ready||!navigator.onLine||state.offline.syncing) return;

  state.offline.syncing=true;
  updateOfflineStatus();

  try{
    const items=(await offlineQueueAll())
      .sort((a,b)=>String(a.queuedAt||'').localeCompare(String(b.queuedAt||'')));

    for(const entry of items){
      if(!navigator.onLine) break;

      try{
        entry.attempts=Number(entry.attempts||0)+1;
        entry.lastAttemptAt=new Date().toISOString();
        await offlineQueuePut(entry);

        const result=await saveRoundPromise(entry.payload);
        await offlineQueueDelete(entry.id);

        console.log(
          'Control pendiente sincronizado:',
          entry.id,
          result&&result.controlNumber?result.controlNumber:''
        );
      }catch(err){
        entry.lastError=err&&err.message?err.message:String(err||'Error');
        entry.lastAttemptAt=new Date().toISOString();
        await offlineQueuePut(entry);

        console.error('Sincronización pendiente:',entry.lastError);

        // Se detiene para no bombardear el servidor si la conexión es inestable.
        break;
      }
    }
  }finally{
    state.offline.syncing=false;
    const remaining=await updateOfflinePendingCount();
    updateOfflineStatus(
      remaining
        ? 'Hay '+remaining+' control(es) pendientes de sincronización.'
        : 'Todos los controles pendientes están sincronizados.'
    );
  }
}

async function showQueuedSuccess(){
  const btn=$('sendButton');
  btn.disabled=true;
  btn.textContent='GUARDADO EN TABLET';

  $('successTitle').textContent='Control guardado en esta tablet.';
  $('successMessage').textContent=
    'No se pudo completar el envío ahora. El control quedó pendiente y se sincronizará cuando vuelva la conexión. '+
    'Puede usar NUEVO CONTROL para comenzar otra ronda.';

  $('successPanel').classList.add('show');
  $('successPanel').scrollIntoView({behavior:'smooth'});

  updateOfflineStatus('Control finalizado y protegido en esta tablet.');
}


function renderApp(){
  state.selected={};
  state.equipmentImages={};
  $('generalContainer').innerHTML='';
  $('sectionsContainer').innerHTML='';
  $('closureContainer').innerHTML='';
  renderGeneral();renderSections();renderClosure();
}

function fieldsFor(scope){
  return state.fields.filter(f=>f.scope===scope).sort((a,b)=>a.order-b.order);
}

function renderGeneral(){
  const card=document.createElement('section');card.className='card';
  card.innerHTML='<div class="section-title">1. '+esc(state.config.GENERAL_TITLE||'Datos generales')+'</div>';
  const grid=document.createElement('div');grid.className='grid';
  fieldsFor('GENERAL').forEach(f=>grid.appendChild(makeField(f,'general')));
  card.appendChild(grid);$('generalContainer').appendChild(card);

  const fecha=document.querySelector('[data-bind="general.fecha"]');
  if(fecha&&fecha.type==='date'&&!fecha.value){
    const d=new Date();fecha.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
}

function renderSections(){
  let visual=2;
  state.sections.forEach(section=>{
    const h=document.createElement('section');h.className='card area-card';
    h.innerHTML='<div class="section-title">'+visual+'. '+esc(section.title)+'</div>'+
      (section.description?'<div class="help">'+esc(section.description)+'</div>':'')+
      '<div class="help">'+esc(state.config.AREA_HELP_TEXT||'')+'</div>';
    $('sectionsContainer').appendChild(h);visual++;

    state.equipment.filter(e=>e.sectionId===section.id).sort((a,b)=>a.order-b.order).forEach(e=>{
      $('sectionsContainer').appendChild(makeEquipmentCard(section,e));
    });

function makeEquipmentCard(section,equipment){
  const key=makeId(section.id+'_'+equipment.order+'_'+equipment.name);
  state.selected[key]=null;

  const hiddenFields=Array.isArray(equipment.hiddenFields)
    ? equipment.hiddenFields.map(fieldKey)
    : [];

  const card=document.createElement('section');
  card.className='card';
  card.dataset.key=key;
  card.dataset.section=section.title;
  card.dataset.equipment=equipment.name;
  card.dataset.hiddenFields=hiddenFields.join(',');

  card.innerHTML=
    '<div class="equipment-header-row">'+
      '<div class="equipment-title">'+esc(equipment.name)+'</div>'+
      '<div id="equipment_media_'+key+'" class="equipment-media">'+
        '<label class="photo-button" data-photo-button>'+
          '<span data-photo-button-text>📷 Adjuntar imagen</span>'+
          '<input type="file" accept="image/*" data-equipment-photo>'+
        '</label>'+
        '<div class="photo-optional" data-photo-optional>(opcional)</div>'+
        '<button type="button" class="photo-remove" data-remove-equipment-photo>Quitar imagen</button>'+
      '</div>'+
    '</div>'+
    '<label>'+esc(state.config.REGISTER_QUESTION||'¿Registrar este equipo / sección?')+'</label>'+
    '<div class="yesno">'+
      '<button type="button" class="pill yes">'+esc(state.config.YES_TEXT||'Sí')+'</button>'+
      '<button type="button" class="pill no">'+esc(state.config.NO_TEXT||'No')+'</button>'+
    '</div>'+
    '<div id="fields_'+key+'" class="fields"></div>'+
    '<div id="no_reason_'+key+'" class="fields">'+
      '<label class="required">'+esc(state.config.NO_REASON_LABEL||'Motivo')+'</label>'+
      '<textarea data-no-reason placeholder="'+attr(state.config.NO_REASON_PLACEHOLDER||'Indique obligatoriamente el motivo')+'"></textarea>'+
    '</div>';

  const buttons=card.querySelectorAll('.pill');
  buttons[0].onclick=()=>toggleEquipment(key,'YES',buttons[0]);
  buttons[1].onclick=()=>toggleEquipment(key,'NO',buttons[1]);

  const container=card.querySelector('#fields_'+key);

  const visibleEquipmentFields=fieldsFor('EQUIPMENT')
    .filter(f=>hiddenFields.indexOf(fieldKey(f.id))===-1);

  const groupedIds=[];

  // 1) ESTADO como campo normal, sin apartado visual.
  // Si "Bomba / Modelo" está habilitado desde Administrar,
  // aparecerá al lado de Estado.
  const topGrid=document.createElement('div');
  topGrid.className='equipment-plain-grid';

  ['estado','bomba_modelo'].forEach(id=>{
    const f=visibleEquipmentFields.find(
      x=>fieldKey(x.id)===fieldKey(id)
    );

    if(!f) return;

    groupedIds.push(fieldKey(f.id));
    topGrid.appendChild(makeField(f,'equipment.'+key));
  });

  if(topGrid.children.length){
    container.appendChild(topGrid);
  }

  // 2) VDF: Voltaje, Frecuencia y Amperaje juntos.
  const vdfFields=['vdf_v','vdf_hz','vdf_a']
    .map(id=>visibleEquipmentFields.find(
      f=>fieldKey(f.id)===fieldKey(id)
    ))
    .filter(Boolean);

  if(vdfFields.length){
    vdfFields.forEach(f=>groupedIds.push(fieldKey(f.id)));

    const block=document.createElement('div');
    block.className='equipment-group';
    block.innerHTML='<div class="equipment-group-title">VDF</div>';

    const grid=document.createElement('div');
    grid.className='grid equipment-grid-vdf';

    vdfFields.forEach(f=>{
      grid.appendChild(makeField(f,'equipment.'+key));
    });

    block.appendChild(grid);
    container.appendChild(block);
  }

  // 3) GENERADOR: todo en un único bloque.
  const generatorFields=[
    'generador_modelo',
    'generador_kva',
    'generador_combustible',
    'generador_horometro'
  ]
    .map(id=>visibleEquipmentFields.find(
      f=>fieldKey(f.id)===fieldKey(id)
    ))
    .filter(Boolean);

  if(generatorFields.length){
    generatorFields.forEach(f=>groupedIds.push(fieldKey(f.id)));

    const block=document.createElement('div');
    block.className='equipment-group';
    block.innerHTML='<div class="equipment-group-title">GENERADOR</div>';

    const grid=document.createElement('div');
    grid.className='grid equipment-grid-generator';

    generatorFields.forEach(f=>{
      grid.appendChild(makeField(f,'equipment.'+key));
    });

    block.appendChild(grid);
    container.appendChild(block);
  }

  // 4) OBSERVACIONES: siempre visible al final cuando el equipo está en "Sí".
  // Se fuerza como opcional para evitar que un problema de configuración
  // la oculte nuevamente.
  let observationField=state.fields.find(
    f=>f.scope==='EQUIPMENT' && fieldKey(f.id)===fieldKey('observaciones')
  );

  if(!observationField){
    observationField={
      scope:'EQUIPMENT',
      id:'observaciones',
      order:99,
      label:'Observaciones',
      type:'textarea',
      required:false,
      active:true,
      optionsGroup:'',
      placeholder:'Sin novedad / condición observada / etc.',
      help:''
    };
  }else{
    observationField=Object.assign({},observationField,{required:false,active:true});
  }

  groupedIds.push(fieldKey(observationField.id));

  const observationWrap=document.createElement('div');
  observationWrap.className='equipment-observation-inline';
  observationWrap.appendChild(makeField(observationField,'equipment.'+key));
  container.appendChild(observationWrap);

  // Cualquier pregunta nueva que agregues desde Administrar seguirá apareciendo,
  // aunque no pertenezca todavía a uno de los bloques anteriores.
  const extras=visibleEquipmentFields.filter(f=>groupedIds.indexOf(fieldKey(f.id))===-1);
  if(extras.length){
    const block=document.createElement('div');
    block.className='equipment-group';
    block.innerHTML='<div class="equipment-group-title">OTROS DATOS</div>';
    const grid=document.createElement('div');
    grid.className='grid';
    extras.forEach(f=>{
      const node=makeField(f,'equipment.'+key);
      if(f.type==='textarea') block.appendChild(node);
      else grid.appendChild(node);
    });
    if(grid.children.length) block.appendChild(grid);
    container.appendChild(block);
  }

  const photoInput=card.querySelector('[data-equipment-photo]');
  if(photoInput){
    photoInput.addEventListener('change',()=>handleEquipmentPhoto(key,photoInput,card));
  }

  const removePhoto=card.querySelector('[data-remove-equipment-photo]');
  if(removePhoto){
    removePhoto.addEventListener('click',()=>clearEquipmentPhoto(key,card));
  }

  return card;
}

function initSignaturePad(){
  const canvas=$('signatureCanvas');
  if(!canvas) return;

  const rect=canvas.getBoundingClientRect();
  const cssWidth=Math.max(rect.width,280);
  const cssHeight=180;
  const ratio=Math.max(window.devicePixelRatio||1,1);

  canvas.width=Math.round(cssWidth*ratio);
  canvas.height=Math.round(cssHeight*ratio);

  const ctx=canvas.getContext('2d');
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(0,0,cssWidth,cssHeight);

  ctx.strokeStyle='#111827';
  ctx.lineWidth=2.2;
  ctx.lineCap='round';
  ctx.lineJoin='round';

  state.signatureCanvas=canvas;
  state.signatureCtx=ctx;
  state.signatureHasInk=false;
  state.signatureEnabled=false;

  updateSignatureUi();

  let drawing=false;

  function pointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return{
      x:e.clientX-r.left,
      y:e.clientY-r.top
    };
  }

  canvas.addEventListener('pointerdown',e=>{
    if(!state.signatureEnabled) return;

    e.preventDefault();
    drawing=true;

    try{canvas.setPointerCapture(e.pointerId)}catch(err){}

    const p=pointFromEvent(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
  });

  canvas.addEventListener('pointermove',e=>{
    if(!state.signatureEnabled||!drawing) return;

    e.preventDefault();

    const p=pointFromEvent(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();

    state.signatureHasInk=true;

    const status=$('signatureStatus');
    if(status){
      status.textContent='Firmando…';
      status.classList.add('active');
      status.classList.remove('signed');
    }
  });

  function endDraw(e){
    if(!drawing) return;
    drawing=false;

    if(e){
      try{canvas.releasePointerCapture(e.pointerId)}catch(err){}
    }

    if(state.signatureHasInk){
      scheduleDraftSave(80);
    }
  }

  canvas.addEventListener('pointerup',endDraw);
  canvas.addEventListener('pointercancel',endDraw);
  canvas.addEventListener('pointerleave',e=>{
    if(e.buttons===0) endDraw(e);
  });

  const enableBtn=$('enableSignatureButton');
  if(enableBtn){
    enableBtn.addEventListener('click',toggleSignatureMode);
  }

  const clearBtn=$('clearSignatureButton');
  if(clearBtn){
    clearBtn.addEventListener('click',clearSignature);
  }
}

function toggleSignatureMode(){
  if(state.signatureEnabled){
    if(!state.signatureHasInk){
      showError('Realice la firma antes de finalizar.');
      return;
    }

    state.signatureEnabled=false;
    updateSignatureUi();
    return;
  }

  state.signatureEnabled=true;
  updateSignatureUi();

  const canvas=$('signatureCanvas');
  if(canvas){
    canvas.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

function updateSignatureUi(){
  const canvas=$('signatureCanvas');
  const overlay=$('signatureLockOverlay');
  const button=$('enableSignatureButton');
  const status=$('signatureStatus');

  if(canvas){
    canvas.classList.toggle('enabled',state.signatureEnabled);
  }

  if(overlay){
    overlay.classList.toggle('hidden',state.signatureEnabled);
    if(!state.signatureEnabled){
      overlay.textContent=state.signatureHasInk
        ? 'Firma bloqueada · pulsa “Editar firma” para modificar'
        : 'Pulsa “Firmar” para habilitar el recuadro';
    }
  }

  if(button){
    button.classList.toggle('active',state.signatureEnabled);

    if(state.signatureEnabled){
      button.textContent='✓ Finalizar firma';
    }else if(state.signatureHasInk){
      button.textContent='✍️ Editar firma';
    }else{
      button.textContent='✍️ Firmar';
    }
  }

  if(status){
    status.classList.remove('active','signed');

    if(state.signatureEnabled){
      status.textContent=state.signatureHasInk?'Firmando…':'Modo firma activo';
      status.classList.add('active');
    }else if(state.signatureHasInk){
      status.textContent='Firma registrada';
      status.classList.add('signed');
    }else{
      status.textContent='Firma pendiente';
    }
  }
}

function clearSignature(){
  const canvas=state.signatureCanvas;
  const ctx=state.signatureCtx;

  if(!canvas||!ctx) return;

  const rect=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,180);
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(0,0,rect.width,180);
  ctx.strokeStyle='#111827';

  state.signatureHasInk=false;
  state.signatureEnabled=false;

  updateSignatureUi();
  scheduleDraftSave(50);
}

function getSignatureData(validate){
  if(validate&&!state.signatureHasInk){
    throw Error('Debe realizar la firma antes de enviar el control.');
  }

  if(!state.signatureHasInk||!state.signatureCanvas){
    return '';
  }

  // Si todavía estaba en modo edición, la bloquea automáticamente
  // antes de capturar la imagen final.
  if(state.signatureEnabled){
    state.signatureEnabled=false;
    updateSignatureUi();
  }

  return state.signatureCanvas.toDataURL('image/png');
}

function makeField(f,prefix){
  const wrap=document.createElement('div');if(f.type==='textarea')wrap.style.marginTop='12px';
  const label=document.createElement('label');label.textContent=f.label;if(f.required)label.classList.add('required');wrap.appendChild(label);
  let input;
  if(f.type==='textarea'){input=document.createElement('textarea')}
  else if(f.type==='select'){
    input=document.createElement('select');const first=document.createElement('option');first.value='';first.textContent='Seleccionar';input.appendChild(first);
    (state.options[f.optionsGroup]||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;input.appendChild(o)})
  }else{input=document.createElement('input');input.type=['text','number','date','time'].includes(f.type)?f.type:'text';if(f.type==='number')input.step='any'}
  input.dataset.fieldId=f.id;input.dataset.bind=prefix+'.'+f.id;input.placeholder=f.placeholder||'';wrap.appendChild(input);
  if(f.help){const h=document.createElement('div');h.className='help';h.textContent=f.help;wrap.appendChild(h)}
  return wrap;
}

function toggleEquipment(key,value,button){
  state.selected[key]=value;
  const card=document.querySelector('[data-key="'+key+'"]');

  if(card) card.classList.remove('missing-decision');

  card.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');

  $('fields_'+key).classList.toggle('show',value==='YES');
  $('no_reason_'+key).classList.toggle('show',value==='NO');

  scheduleDraftSave();
}

function handleEquipmentPhoto(key,input,card){
  const file=input.files&&input.files[0];

  if(!file){
    clearEquipmentPhoto(key,card,false);
    return;
  }

  if(!/^image\//i.test(file.type||'')){
    showError('El archivo seleccionado debe ser una imagen.');
    input.value='';
    return;
  }

  if(file.size>12*1024*1024){
    showError('La imagen es demasiado grande. Seleccione una fotografía menor a 12 MB.');
    input.value='';
    return;
  }

  const button=card.querySelector('[data-photo-button]');
  const text=card.querySelector('[data-photo-button-text]');
  const remove=card.querySelector('[data-remove-equipment-photo]');
  const optional=card.querySelector('[data-photo-optional]');

  if(text) text.textContent='Procesando…';

  compressEquipmentPhoto(file)
    .then(result=>{
      state.equipmentImages[key]={
        dataUrl:result.dataUrl,
        fileName:file.name||'evidencia.jpg'
      };

      if(text) text.textContent='✓ Imagen adjunta';
      if(button) button.classList.add('has-photo');
      if(optional) optional.classList.add('hidden');
      if(remove) remove.classList.add('show');

      scheduleDraftSave(50);
    })
    .catch(err=>{
      input.value='';
      clearEquipmentPhoto(key,card,false);
      showError(err&&err.message?err.message:'No se pudo procesar la imagen.');
    });
}


function compressEquipmentPhoto(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onerror=()=>reject(Error('No se pudo leer la imagen seleccionada.'));

    reader.onload=()=>{
      const img=new Image();

      img.onerror=()=>reject(Error('El formato de la imagen no pudo procesarse. Pruebe con otra fotografía.'));

      img.onload=()=>{
        let width=img.naturalWidth||img.width;
        let height=img.naturalHeight||img.height;

        if(!width||!height){
          reject(Error('La imagen seleccionada no es válida.'));
          return;
        }

        const maxDim=1280;
        const scale=Math.min(1,maxDim/Math.max(width,height));
        width=Math.max(1,Math.round(width*scale));
        height=Math.max(1,Math.round(height*scale));

        const canvas=document.createElement('canvas');
        canvas.width=width;
        canvas.height=height;

        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);

        let quality=.74;
        let dataUrl=canvas.toDataURL('image/jpeg',quality);

        while(dataUrl.length>1200000&&quality>.42){
          quality-=.08;
          dataUrl=canvas.toDataURL('image/jpeg',quality);
        }

        if(dataUrl.length>1500000){
          reject(Error('No se pudo reducir suficientemente la imagen. Seleccione una fotografía más pequeña.'));
          return;
        }

        resolve({
          dataUrl:dataUrl,
          bytes:Math.round((dataUrl.length*3)/4)
        });
      };

      img.src=reader.result;
    };

    reader.readAsDataURL(file);
  });
}

function clearEquipmentPhoto(key,card,clearInput=true){
  state.equipmentImages[key]=null;

  const input=card.querySelector('[data-equipment-photo]');
  const button=card.querySelector('[data-photo-button]');
  const text=card.querySelector('[data-photo-button-text]');
  const remove=card.querySelector('[data-remove-equipment-photo]');
  const optional=card.querySelector('[data-photo-optional]');

  if(text) text.textContent='📷 Adjuntar imagen';
  if(button) button.classList.remove('has-photo');
  if(optional) optional.classList.remove('hidden');
  if(remove) remove.classList.remove('show');
  if(clearInput&&input) input.value='';

  scheduleDraftSave(50);
}


function collectPayload(validate){
  hideError();
  const general={},closure={},equipment=[];

  fieldsFor('GENERAL').forEach(f=>{
    const el=document.querySelector('[data-bind="general.'+f.id+'"]');
    general[f.id]=el?el.value:'';
    if(validate&&f.required&&!String(general[f.id]||'').trim()) throw Error('Falta completar: '+f.label);
  });

  fieldsFor('CLOSURE').forEach(f=>{
    const el=document.querySelector('[data-bind="closure.'+f.id+'"]');
    closure[f.id]=el?el.value:'';
    if(validate&&f.required&&!String(closure[f.id]||'').trim()) throw Error('Falta completar: '+f.label);
  });

  const equipmentCards=Array.from(document.querySelectorAll('[data-key]'));

  if(validate){
    equipmentCards.forEach(card=>card.classList.remove('missing-decision'));

    const unanswered=equipmentCards.filter(card=>{
      const key=card.dataset.key;
      return !state.selected[key];
    });

    if(unanswered.length){
      unanswered.forEach(card=>card.classList.add('missing-decision'));

      const first=unanswered[0];
      first.scrollIntoView({behavior:'smooth',block:'center'});

      throw Error(
        'Debe responder Sí o No en los '+equipmentCards.length+
        ' equipos antes de enviar. Faltan '+unanswered.length+
        '. Primero: '+first.dataset.equipment+'.'
      );
    }
  }

  equipmentCards.forEach(card=>{
    const key=card.dataset.key;
    const decision=state.selected[key];

    if(decision){
      const hiddenFields=String(card.dataset.hiddenFields||'')
        .split(',').map(fieldKey).filter(Boolean);

      const values={};

      fieldsFor('EQUIPMENT').forEach(f=>{
        const hidden=hiddenFields.indexOf(fieldKey(f.id))!==-1;
        const el=hidden ? null : card.querySelector('[data-field-id="'+f.id+'"]');
        values[f.id]=el?el.value:'';

        if(validate && decision==='YES' && !hidden && f.required && !String(values[f.id]||'').trim()){
          throw Error('Falta completar "'+f.label+'" en '+card.dataset.equipment+'.');
        }
      });

      const reasonEl=card.querySelector('[data-no-reason]');
      const reasonNo=decision==='NO' && reasonEl ? reasonEl.value.trim() : '';

      if(validate && decision==='NO' && !reasonNo){
        throw Error('Debe indicar el motivo al responder No en '+card.dataset.equipment+'.');
      }

      const media=state.equipmentImages[key];

      equipment.push({
        section:card.dataset.section,
        name:card.dataset.equipment,
        decision:decision,
        reasonNo:reasonNo,
        hiddenFields:hiddenFields,
        values:values,
        imageData:media&&media.dataUrl?media.dataUrl:'',
        imageName:media&&media.fileName?media.fileName:''
      });
    }
  });

  if(validate&&equipment.length!==equipmentCards.length){
    throw Error(
      'Debe responder Sí o No en todos los '+equipmentCards.length+
      ' equipos antes de enviar el control.'
    );
  }

  const totalImageChars=equipment.reduce(
    (sum,item)=>sum+String(item.imageData||'').length,
    0
  );

  if(validate&&totalImageChars>12000000){
    throw Error('Hay demasiadas imágenes o pesan demasiado. Quite algunas fotografías e intente nuevamente.');
  }

  const signatureData=getSignatureData(validate);

  return{general,closure,equipment,signatureData};
}

function showPreview(){
  try{
    const p=collectPayload(false);
    const body=$('previewBody');
    body.innerHTML='';

    if(!p.equipment.length){
      body.innerHTML='<tr><td colspan="3">No hay equipos respondidos.</td></tr>';
    }

    p.equipment.forEach(item=>{
      const parts=[];
      const decisionLabel=item.decision==='YES'
        ? (state.config.YES_TEXT||'Sí')
        : (state.config.NO_TEXT||'No');

      parts.push('<strong>Respuesta:</strong> '+esc(decisionLabel));

      if(item.decision==='NO'){
        if(item.reasonNo){
          parts.push('<strong>'+esc(state.config.NO_REASON_LABEL||'Motivo')+':</strong> '+esc(item.reasonNo));
        }
      }else{
        fieldsFor('EQUIPMENT').forEach(f=>{
          if(item.hiddenFields.map(fieldKey).indexOf(fieldKey(f.id))!==-1) return;
          const val=item.values[f.id];
          if(String(val||'').trim()){
            parts.push('<strong>'+esc(f.label)+':</strong> '+esc(val));
          }
        });
      }

      if(item.imageData){
        parts.push('<strong>Imagen / evidencia:</strong> adjunta');
      }

      const tr=document.createElement('tr');
      tr.innerHTML=
        '<td>'+esc(item.section)+'</td>'+
        '<td>'+esc(item.name)+'</td>'+
        '<td>'+parts.join('<br>')+'</td>';
      body.appendChild(tr);
    });

    if(state.signatureHasInk){
      const tr=document.createElement('tr');
      tr.innerHTML=
        '<td>Cierre</td>'+
        '<td>Firma</td>'+
        '<td><strong>Firma digital:</strong> registrada</td>';
      body.appendChild(tr);
    }

    $('previewPanel').classList.add('show');
    $('previewPanel').scrollIntoView({behavior:'smooth'});
  }catch(e){
    showError(e.message);
  }
}

async function submitControl(){
  let p;

  try{
    p=collectPayload(true);
  }catch(e){
    showError(e.message);
    return;
  }

  ensureCurrentControlIdentity();

  p.clientControlId=state.offline.clientControlId;
  p.controlCreatedAt=state.offline.controlCreatedAt;

  // Guarda una copia final antes de intentar transmitirla.
  try{
    await saveCurrentDraftNow();
  }catch(e){}

  const btn=$('sendButton');
  btn.disabled=true;

  if(!navigator.onLine){
    btn.textContent='GUARDANDO EN TABLET…';

    try{
      await queueCurrentControl(p,'Sin conexión al finalizar el control.');
      await showQueuedSuccess();
    }catch(e){
      btn.disabled=false;
      btn.textContent=state.config.SEND_BUTTON_TEXT||'ENVIAR CONTROL';
      showError('No se pudo guardar el control pendiente en esta tablet: '+(e.message||e));
    }

    return;
  }

  btn.textContent='ENVIANDO…';

  saveRoundPromise(p)
    .then(async r=>{
      try{
        await offlineKvDelete(OFFLINE_DRAFT_KEY);
      }catch(e){}

      btn.disabled=true;
      btn.textContent='CONTROL ENVIADO';

      $('successTitle').textContent=state.config.SUCCESS_TITLE||'Control registrado correctamente.';

      let msg=(state.config.SUCCESS_MESSAGE||'Se guardaron {count} equipo(s) en una sola ronda.')
        .replace('{count}',r.count);

      if(r.controlNumber){
        msg+=' N° de control: '+r.controlNumber+'.';
      }

      if(r.duplicate){
        msg+=' El sistema detectó que este control ya había sido sincronizado y evitó duplicarlo.';
      }

      if(r.pdfSaved){
        msg+=' PDF firmado generado.';
      }

      if(r.emailSent){
        msg+=' Correo enviado.';
      }

      msg+=' Para registrar otra ronda, use el botón NUEVO CONTROL.';

      $('successMessage').textContent=msg;
      $('successPanel').classList.add('show');
      $('successPanel').scrollIntoView({behavior:'smooth'});

      updateOfflinePendingCount();
      updateOfflineStatus('Control sincronizado y respaldado correctamente.');
    })
    .catch(async e=>{
      // Si no podemos confirmar el envío, preservamos el control localmente.
      // El mismo CLIENT_CONTROL_ID evita duplicarlo si el servidor alcanzó a guardarlo.
      try{
        await queueCurrentControl(
          p,
          e&&e.message?e.message:'No se pudo confirmar el envío.'
        );

        await showQueuedSuccess();
      }catch(localErr){
        btn.disabled=false;
        btn.textContent=state.config.SEND_BUTTON_TEXT||'ENVIAR CONTROL';

        showError(
          'No se pudo confirmar el envío y tampoco guardar la copia pendiente. '+
          (localErr.message||localErr)
        );
      }
    });
}

async function startNewControl(){
  hideError();

  await clearCurrentDraftAndIdentity();

  // Libera primero las imágenes grandes de memoria.
  state.equipmentImages={};

  // Datos generales.
  fieldsFor('GENERAL').forEach(f=>{
    const el=document.querySelector('[data-bind="general.'+f.id+'"]');
    if(!el) return;

    if(f.type==='date'){
      const d=new Date();
      el.value=
        d.getFullYear()+'-'+
        String(d.getMonth()+1).padStart(2,'0')+'-'+
        String(d.getDate()).padStart(2,'0');
    }else{
      el.value='';
    }
  });

  // Cierre.
  fieldsFor('CLOSURE').forEach(f=>{
    const el=document.querySelector('[data-bind="closure.'+f.id+'"]');
    if(el) el.value='';
  });

  // Equipos.
  document.querySelectorAll('[data-key]').forEach(card=>{
    const key=card.dataset.key;

    state.selected[key]=null;

    card.querySelectorAll('.pill').forEach(btn=>{
      btn.classList.remove('active');
    });

    const detail=$('fields_'+key);
    const reason=$('no_reason_'+key);
    const media=$('equipment_media_'+key);

    if(detail) detail.classList.remove('show');
    if(reason) reason.classList.remove('show');

    // Limpia solamente los valores ingresados por el trabajador;
    // no modifica la configuración ni los campos ocultos del equipo.
    card.querySelectorAll('input,select,textarea').forEach(el=>{
      if(el.type==='file'){
        el.value='';
      }else if(el.type==='checkbox'||el.type==='radio'){
        el.checked=false;
      }else{
        el.value='';
      }
    });

    const photoButton=card.querySelector('[data-photo-button]');
    const photoText=card.querySelector('[data-photo-button-text]');
    const photoRemove=card.querySelector('[data-remove-equipment-photo]');
    const photoOptional=card.querySelector('[data-photo-optional]');

    if(photoText) photoText.textContent='📷 Adjuntar imagen';
    if(photoButton) photoButton.classList.remove('has-photo');
    if(photoOptional) photoOptional.classList.remove('hidden');
    if(photoRemove) photoRemove.classList.remove('show');
  });

  // Firma.
  clearSignature();

  // Vista previa y mensajes del control anterior.
  $('previewPanel').classList.remove('show');
  $('previewBody').innerHTML='';
  $('successPanel').classList.remove('show');

  const successMessage=$('successMessage');
  if(successMessage) successMessage.textContent='';

  // Botón ENVIAR vuelve a quedar disponible para una nueva ronda.
  const sendBtn=$('sendButton');
  sendBtn.disabled=false;
  sendBtn.textContent=state.config.SEND_BUTTON_TEXT||'ENVIAR CONTROL';

  // Evita que quede algún mensaje del panel anterior.
  hideError();

  // Lleva al trabajador al inicio sin recargar la aplicación.
  window.scrollTo({top:0,behavior:'smooth'});

  updateOfflineStatus('Nuevo control listo. Autoguardado activo.');
  scheduleDraftSave(250);
}

function themeCssVar(key){
  if(key==='PRIMARY_COLOR')return '--primary';
  if(key==='SECONDARY_COLOR')return '--secondary';
  if(key==='BACKGROUND_COLOR')return '--background';
  return '';
}

function syncThemeColorFromPicker(key,value){
  const hex=document.querySelector('[data-color-hex="'+key+'"]');
  if(hex)hex.value=value.toUpperCase();

  const cssVar=themeCssVar(key);
  if(cssVar)document.documentElement.style.setProperty(cssVar,value);
}

function syncThemeColorFromHex(key,value){
  const fallback=
    key==='PRIMARY_COLOR'?'#174A73':
    key==='SECONDARY_COLOR'?'#2F6EA5':'#F4F7FB';

  const valid=normalizeThemeHex(value,fallback);
  const picker=document.querySelector('[data-color-picker="'+key+'"]');
  const hex=document.querySelector('[data-color-hex="'+key+'"]');

  if(picker)picker.value=valid;
  if(hex)hex.value=valid.toUpperCase();

  const cssVar=themeCssVar(key);
  if(cssVar)document.documentElement.style.setProperty(cssVar,valid);
}

function applyThemePalette(primary,secondary,background){
  [
    ['PRIMARY_COLOR',primary],
    ['SECONDARY_COLOR',secondary],
    ['BACKGROUND_COLOR',background]
  ].forEach(([key,value])=>{
    const picker=document.querySelector('[data-color-picker="'+key+'"]');
    const hex=document.querySelector('[data-color-hex="'+key+'"]');

    if(picker)picker.value=value;
    if(hex)hex.value=value.toUpperCase();

    const cssVar=themeCssVar(key);
    if(cssVar)document.documentElement.style.setProperty(cssVar,value);
  });

  adminStatus('Paleta aplicada en vista previa. Pulsa “Guardar diseño” para conservarla.');
}

function uploadImageFor(key){
  const input=document.querySelector('[data-image-target="'+key+'"]');

  if(!input||!input.files||!input.files[0]){
    adminStatus('Selecciona una imagen primero.',true);
    return;
  }

  const file=input.files[0];

  if(file.size>5*1024*1024){
    adminStatus('La imagen debe ser menor a 5 MB.',true);
    return;
  }

  adminStatus('Subiendo imagen…');

  const reader=new FileReader();

  reader.onerror=()=>{
    adminStatus('No se pudo leer la imagen seleccionada.',true);
  };

  reader.onload=()=>{
    const result=String(reader.result||'');
    const base64=result.split(',')[1]||'';

    google.script.run
      .withSuccessHandler(r=>{
        const urlInput=document.querySelector(
          '#tab_design [data-config-key="'+key+'"]'
        );

        if(
          key==='LOGO_LEFT_URL' ||
          key==='LOGO_RIGHT_URL'
        ){
          if(urlInput)urlInput.value='[imagen guardada]';
          state.config[key]=r.displayUrl||'';
        }else{
          if(urlInput)urlInput.value=r.url||'';
          state.config[key]=r.displayUrl||r.url||'';
        }

        applyConfig();
        adminStatus('Imagen guardada y aplicada correctamente.');
      })
      .withFailureHandler(e=>{
        adminStatus(
          e&&e.message?e.message:'No se pudo guardar la imagen.',
          true
        );
      })
      .adminUploadImage(
        state.adminPin,
        key,
        file.name,
        file.type,
        base64
      );
  };

  reader.readAsDataURL(file);
}


function compressAdminLogo(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onerror=()=>reject(Error('No se pudo leer la imagen.'));

    reader.onload=()=>{
      const img=new Image();

      img.onerror=()=>reject(Error('La imagen seleccionada no es válida.'));

      img.onload=()=>{
        let width=img.naturalWidth||img.width;
        let height=img.naturalHeight||img.height;

        if(!width||!height){
          reject(Error('La imagen no tiene dimensiones válidas.'));
          return;
        }

        const maxW=700;
        const maxH=260;
        const scale=Math.min(1,maxW/width,maxH/height);

        width=Math.max(1,Math.round(width*scale));
        height=Math.max(1,Math.round(height*scale));

        const canvas=document.createElement('canvas');
        canvas.width=width;
        canvas.height=height;

        const ctx=canvas.getContext('2d');
        ctx.clearRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);

        let dataUrl=canvas.toDataURL('image/webp',.86);

        // Fallback para navegadores que no generen webp correctamente.
        if(!dataUrl.startsWith('data:image/webp')){
          dataUrl=canvas.toDataURL('image/png');
        }

        if(dataUrl.length>450000){
          dataUrl=canvas.toDataURL('image/jpeg',.78);
        }

        if(dataUrl.length>480000){
          reject(Error('El logo sigue siendo demasiado pesado. Usa una imagen más liviana.'));
          return;
        }

        resolve(dataUrl);
      };

      img.src=reader.result;
    };

    reader.readAsDataURL(file);
  });
}
