    '<div class="help" style="margin-top:12px"><strong>Campos visibles en este equipo:</strong></div>'+
    '<div class="admin-toolbar" style="margin:6px 0 8px">'+
      '<button type="button" class="secondary-button" onclick="setEquipmentFieldVisibility(this,true)">Mostrar todos</button>'+
      '<button type="button" class="secondary-button" onclick="setEquipmentFieldVisibility(this,false)">Ocultar todos</button>'+
    '</div>'+
    '<div class="yesno eq_visibility_group" style="margin-top:6px">';

  equipmentFields.forEach(f=>{
    const visible=hidden.indexOf(fieldKey(f.id))===-1;
    visibilityHtml+=
      '<label style="display:inline-flex;align-items:center;gap:6px;font-weight:600;border:1px solid #D9DEE7;border-radius:999px;padding:8px 11px;background:'+(visible?'#F0FAF5':'#FFF')+'">'+
      '<input class="eq_visible" data-field-id="'+attr(fieldKey(f.id))+'" type="checkbox" '+(visible?'checked':'')+' style="width:auto;margin:0">'+
      esc(f.label)+'</label>';
  });

  visibilityHtml+='</div>';

  return '<div class="admin-row equipment-admin-row" data-original-hidden="'+attr(hidden.join(','))+'">'+
    '<div class="row-grid-4">'+
      '<div><label>Sección</label><select class="eq_sec">'+opts+'</select></div>'+
      fieldInput('Orden','eq_order',r.order,'number')+
      fieldInput('Equipo','eq_name',r.name)+
      checkboxInput('Activo','eq_active',r.active)+
    '</div>'+visibilityHtml+
  '</div>';
}

function setEquipmentFieldVisibility(button,visible){
  const row=button.closest('.equipment-admin-row');
  if(!row) return;

  row.querySelectorAll('.eq_visible').forEach(cb=>{
    cb.checked=visible;
    const label=cb.closest('label');
    if(label) label.style.background=visible?'#F0FAF5':'#FFF';
  });
}

function addEquipmentRow(){
  const sections=state.adminRaw.sections||[];
  const wrap=document.createElement('div');

  wrap.innerHTML=equipmentRow({
    sectionId:sections[0]?sections[0].id:'',
    order:99,
    name:'Nuevo equipo',
    active:true,
    hiddenFields:[]
  },sections);

  $('equipmentAdminList').appendChild(wrap.firstChild);
}

function saveEquipment(){
  const fieldIds=(state.adminRaw.fields||[])
    .filter(f=>f.scope==='EQUIPMENT'&&f.active)
    .map(f=>fieldKey(f.id));

  const rows=[...document.querySelectorAll('.equipment-admin-row')].map(r=>{
    const visibleCheckboxes=[...r.querySelectorAll('.eq_visible')];

    let hiddenFields;

    if(visibleCheckboxes.length){
      const visibleIds=visibleCheckboxes
        .filter(x=>x.checked)
        .map(x=>fieldKey(x.dataset.fieldId));

      hiddenFields=fieldIds.filter(id=>visibleIds.indexOf(id)===-1);
    }else{
      // Seguridad: si las casillas no se cargaron por algún problema,
      // conserva exactamente lo que ya tenía el equipo.
      hiddenFields=String(r.dataset.originalHidden||'')
        .split(',')
        .map(fieldKey)
        .filter(Boolean);
    }

    return {
      sectionId:r.querySelector('.eq_sec').value,
      order:r.querySelector('.eq_order').value,
      name:r.querySelector('.eq_name').value,
      active:r.querySelector('.eq_active').checked,
      hiddenFields:hiddenFields
    };
  });

  adminStatus('Guardando equipos y campos visibles…');

  google.script.run
    .withSuccessHandler(()=>{
      const hiddenCount=rows.reduce((n,r)=>n+(Array.isArray(r.hiddenFields)?r.hiddenFields.length:0),0);
      refreshAdminData('Guardado correcto: '+rows.length+' equipos actualizados y '+hiddenCount+' campos ocultos en total.');
    })
    .withFailureHandler(e=>adminStatus(e.message,true))
    .adminSaveEquipment(state.adminPin,rows);
}

function renderAdminFields(){
  let html='<div class="section-title">Preguntas / Campos</div>'+
    '<div class="help"><strong>Aquí editas los campos globalmente:</strong> nombre, tipo, orden, obligatorio, activo, opciones, placeholder y ayuda. En la pestaña Equipos decides en cuáles equipos se muestra cada campo.</div>'+
    '<div class="help">Tipos disponibles: text, number, date, time, select, textarea.</div>'+
    '<div id="fieldsAdminList" class="admin-list">';
  (state.adminRaw.fields||[]).forEach(r=>html+=fieldRow(r));
  html+='</div><div class="admin-toolbar"><button class="secondary-button" onclick="addFieldRow()">+ Agregar pregunta</button><button class="main-button" onclick="saveFields()">Guardar preguntas</button></div>';
  $('tab_fields').innerHTML=html;
}

function fieldRow(r){
  return '<div class="admin-row field-admin-row"><div class="row-grid-field">'+
    selectStatic('Ámbito','f_scope',['GENERAL','EQUIPMENT','CLOSURE'],r.scope)+
    fieldInput('ID','f_id',r.id)+fieldInput('Orden','f_order',r.order,'number')+fieldInput('Etiqueta','f_label',r.label)+
    selectStatic('Tipo','f_type',['text','number','date','time','select','textarea'],r.type)+
    checkboxInput('Oblig.','f_required',r.required)+checkboxInput('Activo','f_active',r.active)+
    fieldInput('Opciones','f_group',r.optionsGroup)+fieldInput('Placeholder','f_placeholder',r.placeholder)+
    '</div><div style="margin-top:8px">'+fieldInput('Ayuda','f_help',r.help)+'</div><div class="mini">Si el tipo es select, usa un grupo de OPCIONES.</div></div>';
}

function addFieldRow(){
  const wrap=document.createElement('div');wrap.innerHTML=fieldRow({scope:'EQUIPMENT',id:'nuevo_campo',order:99,label:'Nueva pregunta',type:'text',required:false,active:true,optionsGroup:'',placeholder:'',help:''});
  $('fieldsAdminList').appendChild(wrap.firstChild);
}

function saveFields(){
  const rows=[...document.querySelectorAll('.field-admin-row')].map(r=>({
    scope:r.querySelector('.f_scope').value,id:r.querySelector('.f_id').value,order:r.querySelector('.f_order').value,label:r.querySelector('.f_label').value,
    type:r.querySelector('.f_type').value,required:r.querySelector('.f_required').checked,active:r.querySelector('.f_active').checked,
    optionsGroup:r.querySelector('.f_group').value,placeholder:r.querySelector('.f_placeholder').value,help:r.querySelector('.f_help').value
  }));
  adminStatus('Guardando preguntas…');
  google.script.run.withSuccessHandler(()=>refreshAdminData('Preguntas guardadas.')).withFailureHandler(e=>adminStatus(e.message,true)).adminSaveFields(state.adminPin,rows);
}

function renderAdminOptions(){
  let html='<div class="section-title">Opciones de listas</div><div id="optionsAdminList" class="admin-list">';
  (state.adminRaw.options||[]).forEach(r=>html+=optionRow(r));
  html+='</div><div class="admin-toolbar"><button class="secondary-button" onclick="addOptionRow()">+ Agregar opción</button><button class="main-button" onclick="saveOptions()">Guardar opciones</button></div>';
  $('tab_options').innerHTML=html;
}

function optionRow(r){
  return '<div class="admin-row option-admin-row"><div class="row-grid-4">'+
    fieldInput('Grupo','o_group',r.group)+fieldInput('Orden','o_order',r.order,'number')+fieldInput('Valor','o_value',r.value)+checkboxInput('Activo','o_active',r.active)+'</div></div>';
}

function addOptionRow(){
  const wrap=document.createElement('div');wrap.innerHTML=optionRow({group:'NUEVO_GRUPO',order:99,value:'Nueva opción',active:true});
  $('optionsAdminList').appendChild(wrap.firstChild);
}

function saveOptions(){
  const rows=[...document.querySelectorAll('.option-admin-row')].map(r=>({group:r.querySelector('.o_group').value,order:r.querySelector('.o_order').value,value:r.querySelector('.o_value').value,active:r.querySelector('.o_active').checked}));
  adminStatus('Guardando opciones…');
  google.script.run.withSuccessHandler(()=>refreshAdminData('Opciones guardadas.')).withFailureHandler(e=>adminStatus(e.message,true)).adminSaveOptions(state.adminPin,rows);
}

function renderAdminNotifications(){
  const publicEnabled=configBool('PUBLIC_FORM_ENABLED',true);
  const emailEnabled=configBool('EMAIL_NOTIFICATIONS_ENABLED',false);

  $('tab_notifications').innerHTML=
    '<div class="section-title">Publicación y notificaciones</div>'+ 
    '<div class="admin-row">'+
      '<label style="display:flex;align-items:center;gap:8px"><input id="publicEnabledAdmin" type="checkbox" '+(publicEnabled?'checked':'')+' style="width:auto;transform:scale(1.2)"> Habilitar formulario para pruebas / uso público</label>'+ 
      '<div class="help">Este interruptor abre o cierra el formulario dentro de la app. Para que personas sin tu cuenta puedan entrar, la implementación de Google debe estar configurada una vez como <strong>Cualquier persona</strong>.</div>'+ 
      '<div style="margin-top:10px"><label>Mensaje cuando esté cerrado</label><input id="publicClosedMessageAdmin" value="'+attr(state.config.PUBLIC_CLOSED_MESSAGE||'Control temporalmente cerrado para ajustes.')+'"></div>'+ 
    '</div>'+ 
    '<div class="admin-row" style="margin-top:12px">'+
      '<label style="display:flex;align-items:center;gap:8px"><input id="emailEnabledAdmin" type="checkbox" '+(emailEnabled?'checked':'')+' style="width:auto;transform:scale(1.2)"> Enviar correo al entregar cada control</label>'+ 
      '<div style="margin-top:10px"><label>Correos destinatarios</label><textarea id="emailRecipientsAdmin" placeholder="jefe@empresa.cl; supervisor@empresa.cl">'+esc(state.config.EMAIL_RECIPIENTS||'')+'</textarea><div class="help">Puedes separar varios correos con coma, punto y coma o una línea nueva.</div></div>'+ 
      '<div class="grid" style="margin-top:10px">'+
        '<div><label>Nombre visible del remitente</label><input id="emailSenderNameAdmin" value="'+attr(state.config.EMAIL_SENDER_NAME||'Control Equipos de Impulsión - MCM')+'"><div class="help">Este nombre aparecerá en Gmail junto a la dirección real de envío.</div></div>'+
        '<div><label>Logo MCM dentro del correo</label><input id="emailLogoFileAdmin" type="file" accept="image/*"><button type="button" class="secondary-button" style="margin-top:8px" onclick="uploadEmailLogo()">Subir logo MCM</button><div class="help">'+(state.config.EMAIL_LOGO_FILE_ID?'✓ Logo configurado':'Aún no hay logo configurado')+'</div></div>'+
      '</div>'+
      '<div class="grid" style="margin-top:10px">'+
        '<div><label>Asunto</label><input id="emailSubjectAdmin" value="'+attr(state.config.EMAIL_SUBJECT||'Nuevo Control Equipos de Impulsión - {fecha} - Turno {turno}')+'"><div class="help">Variables disponibles: {fecha}, {turno}, {jornada}, {supervisor}, {trabajador}, {id}</div></div>'+ 
        '<div><label>Texto inicial</label><input id="emailIntroAdmin" value="'+attr(state.config.EMAIL_INTRO||'Se ha recibido un nuevo control de equipos de impulsión.')+'"></div>'+ 
      '</div>'+ 
    '</div>'+ 
    '<div class="admin-toolbar">'+
      '<button class="main-button" onclick="saveNotificationSettings()">Guardar configuración</button>'+ 
      '<button class="secondary-button" onclick="sendTestEmail()">Enviar correo de prueba</button>'+ 
    '</div>'+ 
    '<div class="help"><strong>Registro:</strong> cada envío sigue quedando en REGISTROS y además se crea una fila resumen en RONDAS.</div>';
}

function saveNotificationSettings(){
  // Enviar solo las claves modificadas en esta pestaña.
  // Así evitamos reenviar logos cargados como data:image, que pueden
  // superar el límite de 50.000 caracteres por celda de Google Sheets.
  const obj={
    PUBLIC_FORM_ENABLED:$('publicEnabledAdmin').checked?'TRUE':'FALSE',
    PUBLIC_CLOSED_MESSAGE:$('publicClosedMessageAdmin').value,
    EMAIL_NOTIFICATIONS_ENABLED:$('emailEnabledAdmin').checked?'TRUE':'FALSE',
    EMAIL_RECIPIENTS:$('emailRecipientsAdmin').value,
    EMAIL_SENDER_NAME:$('emailSenderNameAdmin').value,
    EMAIL_SUBJECT:$('emailSubjectAdmin').value,
    EMAIL_INTRO:$('emailIntroAdmin').value
  };

  adminStatus('Guardando configuración…');
  google.script.run
    .withSuccessHandler(data=>{
      state.config=data.config||Object.assign({},state.config,obj);
      applyConfig();
      renderAdminNotifications();
      adminStatus('Configuración guardada.');
    })
    .withFailureHandler(e=>adminStatus(e.message,true))
    .adminSaveConfig(state.adminPin,obj);
}


function uploadEmailLogo(){
  const input=$('emailLogoFileAdmin');

  if(!input||!input.files||!input.files[0]){
    adminStatus('Selecciona primero una imagen para el logo del correo.',true);
    return;
  }

  const file=input.files[0];

  if(file.size>5*1024*1024){
    adminStatus('El logo debe pesar menos de 5 MB.',true);
    return;
  }

  adminStatus('Subiendo logo del correo…');

  const reader=new FileReader();

  reader.onerror=()=>adminStatus('No se pudo leer la imagen.',true);

  reader.onload=()=>{
    const base64=String(reader.result||'').split(',')[1]||'';

    google.script.run
      .withSuccessHandler(r=>{
        state.config.EMAIL_LOGO_FILE_ID=r.fileId||'';
        renderAdminNotifications();
        adminStatus('Logo del correo guardado correctamente.');
      })
      .withFailureHandler(e=>adminStatus(e.message,true))
      .adminUploadEmailLogo(
        state.adminPin,
        file.name,
        file.type,
        base64
      );
  };

  reader.readAsDataURL(file);
}

function sendTestEmail(){
  adminStatus('Enviando correo de prueba…');
  google.script.run
    .withSuccessHandler(r=>adminStatus('Correo de prueba enviado a: '+(r.recipients||[]).join(', ')))
    .withFailureHandler(e=>adminStatus(e.message,true))
    .adminSendTestEmail(state.adminPin);
}

function renderAdminSecurity(){
  $('tab_security').innerHTML='<div class="section-title">Seguridad</div><div class="admin-grid">'+
    '<div><label>PIN actual</label><input id="currentPinChange" type="password"></div>'+
    '<div><label>Nuevo PIN</label><input id="newPinChange" type="password"></div></div>'+
    '<div class="admin-toolbar"><button class="main-button" onclick="changePin()">Cambiar PIN</button></div>'+
    '<div class="help">El PIN protege únicamente la edición. Los trabajadores siguen usando la app normalmente.</div>';
}

function changePin(){
  const current=$('currentPinChange').value,newPin=$('newPinChange').value;
  google.script.run.withSuccessHandler(()=>{state.adminPin=newPin;$('currentPinChange').value='';$('newPinChange').value='';adminStatus('PIN cambiado correctamente.');}).withFailureHandler(e=>adminStatus(e.message,true)).changeAdminPin(current,newPin);
}

function refreshAdminData(msg){
  google.script.run.withSuccessHandler(data=>{
    state.adminRaw=data.admin;state.config=data.config||state.config;state.sections=data.sections||state.sections;state.equipment=data.equipment||state.equipment;state.fields=data.fields||state.fields;state.options=data.options||state.options;
    renderAdminAll();applyConfig();renderApp();adminStatus(msg);
  }).withFailureHandler(e=>adminStatus(e.message,true)).getAdminData(state.adminPin);
}

function fieldInput(label,cls,value,type='text'){return '<div><label>'+esc(label)+'</label><input class="'+cls+'" type="'+type+'" value="'+attr(value==null?'':value)+'"></div>'}
function checkboxInput(label,cls,checked){return '<div><label>'+esc(label)+'</label><input class="'+cls+'" type="checkbox" '+(checked?'checked':'')+' style="width:auto;transform:scale(1.25);margin:9px"></div>'}
function selectStatic(label,cls,values,current){let o='';values.forEach(v=>o+='<option '+(String(v)===String(current)?'selected':'')+'>'+esc(v)+'</option>');return '<div><label>'+esc(label)+'</label><select class="'+cls+'">'+o+'</select></div>'}

function adminStatus(msg,isError=false){const el=$('adminStatus');el.textContent=msg;el.style.color=isError?'#B42318':'#157347'}

/* ================= UTIL ================= */
function showError(text){$('errorBox').textContent=text;$('errorBox').classList.add('show');$('errorBox').scrollIntoView({behavior:'smooth'})}
function hideError(){$('errorBox').classList.remove('show');$('errorBox').textContent=''}
function showFatal(err){$('loading').innerHTML='<strong>No se pudo cargar la aplicación.</strong><br><br>'+esc(err&&err.message?err.message:String(err))}
function fieldKey(v){
  return String(v == null ? '' : v).trim().toLowerCase();
}

function makeId(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function attr(s){return esc(s).replace(/`/g,'&#096;')}
</script>
